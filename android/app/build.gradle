plugins { id 'com.android.application' }

android {
    namespace 'kr.ac.isip.roadgateway'
    compileSdk 34
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'kr.ac.isip.roadgateway'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'kr.ac.isip.roadgateway.GatewayRegressionInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
